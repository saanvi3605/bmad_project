# ─────────────────────────────────────────────────────────────────────────────
# BMAD Pipeline — Centralized Model & Runtime Configuration
# config/models.yaml
#
# Single source of truth for:
#   - LLM provider, model, and inference parameters
#   - Retry limits for the two feedback loops
#   - Executor subprocess settings
#   - Session archiving
#   - Cost coefficients used by observability.py
#
# Do NOT put secrets here. API keys live in .env only.
# ─────────────────────────────────────────────────────────────────────────────

# Heavy model — used by: architect, developer, reviewer
# Reviewer needs 70b to genuinely understand the full generated code.
# Planner stays on 8b — architect (70b) compensates for any weak spec.
# NOTE: meta-llama/llama-4-scout-17b-16e-instruct was removed — LiteLLM's
#       response parser raises KeyError("content") on its reply format.
#       llama-3.3-70b-versatile is the proven-stable Groq model.
llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.1
  max_tokens: 4096
  request_timeout: 120

# Light model — used by: prompt_refiner, complexity_scorer, planner,
#                         tester, test_writer
llm_light:
  provider: groq
  model: llama-3.1-8b-instant
  temperature: 0.1
  max_tokens: 2048
  request_timeout: 60

# ── Reviewer ─────────────────────────────────────────────────────────────────
# Disable when on a low-TPM model (e.g. llama-3.1-8b-instant) — the generated
# code alone exceeds the 6 000-token per-request limit on free tier.
# The deterministic validator still runs regardless of this setting.
reviewer:
  enabled: true   # re-enabled — now runs on 8b (light=True), freeing 70b quota for arch+dev

# ── Retry / loop limits ───────────────────────────────────────────────────────
retry_limits:
  # Validator → Developer loop.  Matches current should_fix() ceiling.
  validator_max_retries: 2
  # Reviewer → Developer loop.  Matches current should_retry() ceiling.
  reviewer_max_retries: 2
  # Executor → Developer loop (runtime self-healing).
  # App crash stderr is sent back to Developer for up to N fix attempts.
  executor_max_retries: 2

# ── Executor subprocess settings ─────────────────────────────────────────────
executor:
  # Seconds to wait after launching the generated app before checking
  # whether the process is still alive.  Streamlit needs more than the
  # original 5s used for FastAPI because Streamlit's dev-server startup
  # (Tornado init + component registration) takes 6-8s on a cold start.
  startup_wait_seconds: 8
  # Path written by executor_agent and read by the Streamlit UI for download.
  output_file: outputs/generated_app.py
  test_output_file: outputs/test_generated_app.py
  readme_output_file: outputs/README.md

# ── Session archiving ─────────────────────────────────────────────────────────
session:
  # When true, executor_agent copies every pipeline artifact into a
  # per-session subdirectory so runs can be compared or replayed.
  archive_outputs: true
  # Parent directory for per-session archives.  A UUID subdirectory is
  # created inside this directory for each pipeline run.
  output_dir: outputs/sessions/

# ── Complexity Scorer ────────────────────────────────────────────────────────
#
# Lightweight prompt classification before the main generation pipeline.
# Score 1-threshold: use simple_model for all heavy agents (saves tokens/cost).
# Score threshold+1 to 10: use the heavy llm: model (no override).
complexity_scorer:
  # Prompts scoring at or below this threshold use the light model.
  simple_threshold: 4
  # Model to use when the prompt is deemed simple.
  simple_model: llama-3.1-8b-instant
  # Prompts scoring at or below this threshold are routed to project_final_final
  # via A2A instead of running the full BMAD pipeline. Scored on the RAW prompt
  # (before PromptRefiner) so natural scores like 1-3 correctly trigger A2A.
  a2a_threshold: 4

# ── Observability / cost tracking ────────────────────────────────────────────
#
# Cost coefficients for llama-3.3-70b-versatile (heavy model).
# Light model (llama-3.1-8b-instant) costs are negligible ($0.05/$0.08 per M).
# Units: USD per 1,000,000 tokens.
observability:
  cost_per_million_input_tokens: 0.59
  cost_per_million_output_tokens: 0.79
  # Whether to compute and log cost estimates.  Set false to skip arithmetic.
  track_cost: true
  # Whether to attach per-agent token counts to the agent_log list in state.
  track_tokens: true
